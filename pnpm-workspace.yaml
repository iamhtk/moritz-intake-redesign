# pnpm >=10 no longer hoists these to the root by default; packages run `eslint`
# and `prettier` from shared configs without declaring them, so keep pnpm 9's behaviour.
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'

# pnpm >=10 runs dependency install scripts only for packages approved here.
# true: needs its native/binary setup step. false: the script only prints a banner.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  cbor-extract: true
  esbuild: true
  unrs-resolver: true
  core-js: false
  msw: false

